<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen Slurp — Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#171717;--surface:#1e1e1e;--surface2:#2a2a2a;--border:#333;--text:#e0e0e0;
  --text-dim:#888;--accent:#615ced;--accent-hover:#7a6fff;--green:#4caf50;--orange:#ff9800;
  --red:#f44336;--blue:#2196f3;--radius:12px;--mono:'JetBrains Mono','Fira Code','Consolas',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header .logo{font-size:18px;font-weight:700;color:var(--accent)}
header .logo span{color:var(--text)}
.controls{display:flex;align-items:center;gap:8px;margin-left:auto}
select,input[type=checkbox]{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
select:hover{border-color:var(--accent)}
label{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;cursor:pointer}
button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
button:hover{background:var(--border)}
button.accent{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.accent:hover{background:var(--accent-hover)}
button.accent:disabled{opacity:.5;cursor:default}
.status{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);transition:background .3s}
.dot.ok{background:var(--green)}
.dot.busy{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Chat area */
#chat{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:0}
.msg-row{display:flex;gap:12px;padding:12px 24px;max-width:900px;margin:0 auto;width:100%}
.msg-row.user{background:transparent}
.msg-row.assistant{background:var(--surface)}
.avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.avatar.user{background:var(--accent);color:#fff}
.avatar.assistant{background:var(--surface2);border:1px solid var(--border);color:var(--accent)}
.msg-body{flex:1;min-width:0}
.msg-role{font-size:11px;color:var(--text-dim);margin-bottom:2px;text-transform:capitalize}
.msg-content{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg-content p{margin:8px 0}
.msg-content code{font-family:var(--mono);font-size:13px;background:var(--surface2);padding:2px 6px;border-radius:4px}
.msg-content pre{background:var(--surface2);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0;border:1px solid var(--border)}
.msg-content pre code{background:none;padding:0}
.thinking-block{font-size:13px;color:var(--text-dim);background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:8px 12px;margin:4px 0;white-space:pre-wrap;line-height:1.5;max-height:300px;overflow-y:auto}
.thinking-label{font-size:11px;color:var(--orange);margin-bottom:2px;font-weight:600}
.tool-block{font-size:12px;color:var(--blue);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:4px 0}
.tool-label{font-size:11px;color:var(--blue);margin-bottom:2px;font-weight:600}
.tool-args{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:pre-wrap;word-break:break-all}

/* Typing indicator */
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Debug panel */
#debug-toggle{position:fixed;bottom:80px;right:16px;z-index:100;opacity:.7}
#debug{position:fixed;bottom:0;right:0;width:45%;height:50vh;background:var(--surface);border-top:1px solid var(--border);border-left:1px solid var(--border);display:none;flex-direction:column;z-index:99}
#debug.show{display:flex}
#debug-header{padding:6px 12px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-dim)}
#debug-log{flex:1;overflow-y:auto;padding:8px;font-family:var(--mono);font-size:11px;line-height:1.4;color:var(--text-dim)}
#debug-log .chunk{margin-bottom:4px;padding:2px 6px;border-radius:3px;background:var(--bg);white-space:pre-wrap;word-break:break-all}
#debug-log .chunk .ts{color:var(--green)}
#debug-log .chunk .type{color:var(--accent)}
#debug-log .chunk .data{color:var(--text)}
#debug-log .chunk.err .data{color:var(--red)}

/* Input */
footer{background:var(--surface);border-top:1px solid var(--border);padding:12px 24px;flex-shrink:0}
.input-wrap{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#input{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:14px;font-family:inherit;resize:none;max-height:120px;min-height:42px}
#input:focus{outline:none;border-color:var(--accent)}
#input::placeholder{color:var(--text-dim)}
.hint{text-align:center;font-size:10px;color:var(--text-dim);padding:4px 0 0;margin-top:4px}
.hint kbd{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 4px;font-size:10px}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);gap:8px}
.empty h2{font-size:24px;color:var(--text)}
.empty p{font-size:14px}
.empty .examples{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.empty .example{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
.empty .example:hover{border-color:var(--accent);color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="logo">Qwen <span>Slurp</span></div>
  <div class="controls">
    <select id="model"></select>
    <label><input type="checkbox" id="streamChk" checked> Stream</label>
    <label><input type="checkbox" id="debugChk"> Debug</label>
    <button id="clearBtn">Clear</button>
    <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">...</span></div>
  </div>
</header>

<div id="chat">
  <div class="empty" id="emptyState">
    <h2>Qwen Slurp</h2>
    <p>OpenAI-compatible proxy for Qwen models</p>
    <div class="examples">
      <div class="example" onclick="fillExample(this)">What is 2+2?</div>
      <div class="example" onclick="fillExample(this)">Write a Python fib function</div>
      <div class="example" onclick="fillExample(this)">What's the weather in London?</div>
      <div class="example" onclick="fillExample(this)">Explain quantum computing</div>
    </div>
  </div>
</div>

<div id="debug">
  <div id="debug-header">
    <span>SSE Debug Log</span>
    <button onclick="document.getElementById('debug').classList.remove('show')">Hide</button>
  </div>
  <div id="debug-log"></div>
</div>

<footer>
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Send a message..." autofocus></textarea>
    <button id="sendBtn" class="accent">Send</button>
  </div>
  <div class="hint"><kbd>Enter</kbd> send · <kbd>Shift+Enter</kbd> newline · <kbd>Ctrl+D</kbd> toggle debug</div>
</footer>

<script>
const API = location.origin;
const chatEl = document.getElementById('chat');
const emptyEl = document.getElementById('emptyState');
const inEl = document.getElementById('input');
const modelSel = document.getElementById('model');
const streamChk = document.getElementById('streamChk');
const debugChk = document.getElementById('debugChk');
const debugEl = document.getElementById('debug');
const debugLog = document.getElementById('debug-log');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const stDot = document.getElementById('statusDot');
const stText = document.getElementById('statusText');
let sending = false;
let messages = [];

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtContent(text) {
  // Simple markdown: code blocks, inline code, bold
  let html = esc(text);
  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_,lang,code) => `<pre><code>${code.trim()}</code></pre>`);
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return html;
}

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function fillExample(el) {
  inEl.value = el.textContent;
  inEl.focus();
  inEl.style.height = 'auto';
  inEl.style.height = Math.min(inEl.scrollHeight, 120) + 'px';
}

function addMsg(role) {
  if (emptyEl) emptyEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const avatar = role === 'user' ? 'U' : 'Q';
  row.innerHTML = `<div class="avatar ${role}">${avatar}</div><div class="msg-body"><div class="msg-role">${role}</div><div class="msg-content"></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  return row.querySelector('.msg-content');
}

function addTyping() {
  const content = addMsg('assistant');
  content.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  return content;
}

function addThinkingBlock(contentEl) {
  let block = contentEl.querySelector('.thinking-block');
  if (!block) {
    block = document.createElement('div');
    block.className = 'thinking-block';
    block.innerHTML = '<div class="thinking-label">Thinking...</div><div class="thinking-text"></div>';
    contentEl.appendChild(block);
  }
  return block.querySelector('.thinking-text');
}

function addToolBlock(contentEl, name) {
  const block = document.createElement('div');
  block.className = 'tool-block';
  block.innerHTML = `<div class="tool-label">Tool: ${esc(name)}</div><div class="tool-args"></div>`;
  contentEl.appendChild(block);
  return block.querySelector('.tool-args');
}

function debugChunk(type, data) {
  if (!debugChk.checked) return;
  const ts = new Date().toLocaleTimeString('en-US', {hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit',millisecond:'3-digit'});
  const div = document.createElement('div');
  div.className = 'chunk' + (type === 'error' ? ' err' : '');
  div.innerHTML = `<span class="ts">${ts}</span> <span class="type">[${type}]</span> <span class="data">${esc(typeof data === 'string' ? data : JSON.stringify(data))}</span>`;
  debugLog.appendChild(div);
  debugLog.scrollTop = debugLog.scrollHeight;
}

function setSending(b) {
  sending = b;
  sendBtn.disabled = b;
  sendBtn.textContent = b ? '...' : 'Send';
  inEl.disabled = b;
}

async function send() {
  if (sending) return;
  const text = inEl.value.trim();
  if (!text) return;
  inEl.value = '';
  inEl.style.height = 'auto';

  addMsg('user').textContent = text;
  messages.push({ role: 'user', content: text });

  const contentEl = addTyping();
  const model = modelSel.value;
  const stream = streamChk.checked;

  setSending(true);
  stDot.className = 'dot busy';
  stText.textContent = 'Generating...';

  const body = { model, messages: [...messages], stream: true };
  debugChunk('request', body);

  try {
    const resp = await fetch(`${API}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const e = await resp.json().catch(() => ({ error: { message: resp.statusText } }));
      contentEl.textContent = 'Error: ' + (e.error?.message || resp.statusText);
      return;
    }

    if (stream) {
      contentEl.innerHTML = '';
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let fullText = '';
      let reasoningText = '';
      let toolCalls = {};

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') { debugChunk('done', '[DONE]'); continue; }

          try {
            const chunk = JSON.parse(data);
            const choice = chunk.choices?.[0];
            const delta = choice?.delta;
            if (!delta) continue;

            debugChunk('chunk', { content: delta.content?.slice(0,50), reasoning: delta.reasoning_content?.slice(0,50), tool_calls: delta.tool_calls, finish: choice.finish_reason });

            // Reasoning content
            if (delta.reasoning_content) {
              const thinkEl = addThinkingBlock(contentEl);
              reasoningText += delta.reasoning_content;
              thinkEl.textContent = reasoningText;
              scrollBottom();
            }

            // Tool calls
            if (delta.tool_calls) {
              for (const tc of delta.tool_calls) {
                const id = tc.id || '0';
                if (!toolCalls[id]) {
                  toolCalls[id] = { name: '', args: '' };
                  toolCalls[id]._el = addToolBlock(contentEl, tc.function?.name || '...');
                }
                if (tc.function?.name) {
                  toolCalls[id].name = tc.function.name;
                }
                if (tc.function?.arguments) {
                  toolCalls[id].args += tc.function.arguments;
                  toolCalls[id]._el.textContent = toolCalls[id].args;
                }
                scrollBottom();
              }
            }

            // Text content
            if (delta.content) {
              fullText += delta.content;
              // Remove typing indicator if present
              const typing = contentEl.querySelector('.typing');
              if (typing) typing.remove();
              // Remove thinking block if we're now getting real content
              contentEl.innerHTML = '';
              contentEl.textContent = fullText;
              scrollBottom();
            }
          } catch (e) {}
        }
      }

      // Finalize
      const typing = contentEl.querySelector('.typing');
      if (typing) typing.remove();
      if (!fullText) {
        contentEl.textContent = '(empty response)';
      }
      messages.push({ role: 'assistant', content: fullText });
    } else {
      const data = await resp.json();
      debugChunk('response', data);
      const content = data.choices?.[0]?.message?.content || '(empty)';
      contentEl.textContent = content;
      messages.push({ role: 'assistant', content });
      scrollBottom();
    }
  } catch (e) {
    contentEl.textContent = 'Error: ' + e.message;
    debugChunk('error', e.message);
  } finally {
    setSending(false);
    stDot.className = 'dot ok';
    stText.textContent = 'Ready';
    inEl.focus();
  }
}

inEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inEl.addEventListener('input', () => {
  inEl.style.height = 'auto';
  inEl.style.height = Math.min(inEl.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', send);
clearBtn.addEventListener('click', () => {
  messages = [];
  chatEl.innerHTML = '';
  chatEl.appendChild(emptyEl);
  emptyEl.style.display = 'flex';
});

// Debug toggle
debugChk.addEventListener('change', () => {
  debugEl.classList.toggle('show', debugChk.checked);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'd') { e.preventDefault(); debugChk.checked = !debugChk.checked; debugEl.classList.toggle('show', debugChk.checked); }
});

async function loadModels() {
  try {
    const r = await fetch(`${API}/v1/models`);
    const d = await r.json();
    modelSel.innerHTML = '';
    for (const m of d.data) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.id;
      if (m.id === 'qwen3.7-plus') o.selected = true;
      modelSel.appendChild(o);
    }
  } catch {}
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    stDot.className = 'dot ok';
    stText.textContent = d.status === 'ok' ? 'Ready' : 'Degraded';
  } catch {
    stDot.className = 'dot';
    stText.textContent = 'Offline';
  }
}

loadModels();
checkHealth();
inEl.focus();
</script>
</body>
</html>
